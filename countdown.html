<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Countdown to February 13, 2027</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; width: 100%; background: #fff; }
    body { color: #37352f; -webkit-text-size-adjust: 100%; }
    .countdown-widget {
      width: 100%; min-height: 190px; padding: 22px;
      display: flex; flex-direction: column; justify-content: center;
      font-family: Georgia, 'Times New Roman', serif;
    }
    .countdown-heading { display: flex; align-items: center; gap: 12px; }
    .countdown-icon { display: block; width: 42px; height: 42px; flex: 0 0 42px; color: #aa7942; }
    h1 {
      margin: 0; font-family: Georgia, 'Times New Roman', serif;
      font-size: 30px; font-weight: 700; letter-spacing: -0.7px; line-height: 1.3;
      flex: 1; min-width: 0; overflow-wrap: break-word;
    }
    .countdown-date {
      display: block; margin-top: 8px; color: #8b8884;
      font-size: 16px; font-weight: 600; line-height: 1.5;
    }
    @media (max-width: 420px) {
      .countdown-widget { padding: 18px; }
      h1 { font-size: 28px; }
    }
    @media (max-width: 359px) {
      .countdown-widget { padding: 16px; min-height: 170px; }
      h1 { font-size: 24px; }
      .countdown-icon { width: 34px; height: 34px; flex-basis: 34px; }
      .countdown-date { font-size: 14px; }
    }
  </style>
</head>
<body>
  <main class="countdown-widget" aria-label="Countdown to February 13, 2027">
    <div class="countdown-heading">
      <svg class="countdown-icon" viewBox="0 0 48 48" fill="none"
           stroke="currentColor" stroke-width="3.4" stroke-linecap="round"
           stroke-linejoin="round" aria-hidden="true" focusable="false">
        <rect x="7" y="10" width="34" height="32" rx="4"/>
        <path d="M15 6v9M33 6v9M7 21h34M24 28v8M20 32h8"/>
      </svg>
      <h1 id="countdown" aria-live="polite" aria-atomic="true">Days to go</h1>
    </div>
    <time class="countdown-date" datetime="2027-02-13">February 13, 2027</time>
  </main>
  <script>
    (function () {
      'use strict';
      var heading = document.getElementById('countdown');
      var midnightTimer;

      function daysUntil(now) {
        // Compare calendar dates, so daylight-saving changes do not skip a day.
        var today = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
        return (Date.UTC(2027, 1, 13) - today) / 86400000;
      }

      function update() {
        var days = daysUntil(new Date());
        var text = days > 1 ? days + ' days to go' :
          days === 1 ? '1 day to go' :
          days === 0 ? 'Today’s the day' : 'Countdown complete';
        if (heading.textContent !== text) { heading.textContent = text; }
      }

      function refresh() {
        update();
        window.clearTimeout(midnightTimer);
        var now = new Date();
        var midnight = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
        midnightTimer = window.setTimeout(refresh,
          Math.max(1000, midnight.getTime() - now.getTime() + 50));
      }

      refresh();
      window.setInterval(update, 60000);
      window.addEventListener('pageshow', refresh);
      window.addEventListener('focus', refresh);
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) { refresh(); }
      });
    }());
  </script>
</body>
</html>
