<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Pebbsz's Notion Widgets</title>
  <style>
    * { box-sizing: border-box; }
    body {
      max-width: 620px;
      margin: 36px auto;
      padding: 0 22px;
      color: #37352f;
      background: #fff;
      font: 17px/1.6 Georgia, 'Times New Roman', serif;
    }
    h1 { margin: 0 0 12px; font-size: 30px; line-height: 1.3; letter-spacing: -0.7px; }
    p { margin: 12px 0; }
    ul { list-style: none; margin: 24px 0; padding: 0; }
    li { border-bottom: 1px solid #e8e0d6; }
    a { color: #76532c; }
    li a { display: block; padding: 16px 8px; text-decoration: none; font-size: 20px; }
    li a:hover { background: #faf7f3; }
    a:focus-visible { outline: 2px solid #aa7942; outline-offset: 3px; }
    .help { color: #6e655d; font-size: 15px; }
  </style>
</head>
<body>
  <h1>Your planner widgets</h1>
  <p>Open a widget, copy its web address, then paste it into an Embed block in Notion.</p>
  <ul>
    <li><a href="greeting/">Daily greeting</a></li>
    <li><a href="prayer/">Today’s prayer</a></li>
    <li><a href="calendar/">2026 Calendar heading</a></li>
    <li><a href="sleep-goals/">Sleep Goals</a></li>
  </ul>
  <p class="help">Each widget has its own address. Use that address wherever you want the widget to appear in your planner.</p>
</body>
</html>
