<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Sleep Goals</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #fff;
      color: #37352f;
      font-family: Georgia, 'Times New Roman', serif;
      -webkit-text-size-adjust: 100%;
    }
    main { padding: 22px; }
    header, dt { display: flex; align-items: center; gap: 12px; }
    svg { display: block; flex: none; color: #aa7942; }
    header svg { width: 42px; height: 42px; }
    h1 {
      margin: 0;
      font: 700 30px/1.3 Georgia, 'Times New Roman', serif;
      letter-spacing: -0.7px;
    }
    dl {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      max-width: 480px;
      margin: 16px 0 0;
    }
    .goal + .goal { border-left: 1px solid #e8e0d6; padding-left: 20px; }
    dt { gap: 7px; color: #6e655d; font-size: 16px; line-height: 1.4; }
    dt svg { width: 20px; height: 20px; }
    dd { margin: 4px 0 0 27px; font-size: 26px; line-height: 1.25; }
    time { white-space: nowrap; }
    .period { font-size: 0.58em; letter-spacing: 0.04em; }
    @media (max-width: 420px) {
      main { padding: 18px; }
      h1 { font-size: 28px; }
      .goal + .goal { padding-left: 14px; }
      dd { font-size: 24px; }
    }
    @media (max-width: 359px) {
      main { padding: 16px; }
      header svg { width: 34px; height: 34px; }
      h1 { font-size: 24px; }
    }
    @media (max-width: 299px) {
      dl { grid-template-columns: 1fr; gap: 14px; }
      .goal + .goal { border-left: 0; padding-left: 0; }
    }
  </style>
</head>
<body>
  <main aria-labelledby="sleep-goals-title">
    <header>
      <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3.4"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <path d="M6 12v26m0-7h36v7M6 26h36v5M22 26V15h13a7 7 0 0 1 7 7v4"/>
        <rect x="10" y="16" width="9" height="7" rx="3"/>
      </svg>
      <h1 id="sleep-goals-title">Sleep Goals</h1>
    </header>
    <dl>
      <div class="goal">
        <dt>
          <svg viewBox="0 0 48 48" fill="none" aria-hidden="true" focusable="false">
            <circle cx="24" cy="24" r="8" fill="currentColor"/>
            <path d="M24 4v6m0 28v6M4 24h6m28 0h6M10 10l4.2 4.2m19.6 19.6L38 38M10 38l4.2-4.2m19.6-19.6L38 10"
                  stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/>
          </svg>
          Wake up by
        </dt>
        <dd><time datetime="06:30">6:30 <span class="period">AM</span></time></dd>
      </div>
      <div class="goal">
        <dt>
          <svg viewBox="0 0 48 48" aria-hidden="true" focusable="false">
            <path d="M33 5a19 19 0 1 0 10 30A20 20 0 0 1 33 5Z" fill="currentColor"/>
          </svg>
          In bed by
        </dt>
        <dd><time datetime="21:30">9:30 <span class="period">PM</span></time></dd>
      </div>
    </dl>
  </main>
</body>
</html>
