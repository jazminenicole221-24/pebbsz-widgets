<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>2026 Calendar</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; width: 100%; background: #fff; }
    body { color: #37352f; -webkit-text-size-adjust: 100%; }
    .calendar-heading {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 22px;
    }
    .calendar-icon {
      display: block;
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      color: #aa7942;
    }
    h1 {
      margin: 0;
      font: 700 30px/1.3 Georgia, 'Times New Roman', serif;
      letter-spacing: -0.7px;
    }
    @media (max-width: 420px) {
      .calendar-heading { padding: 18px; }
      h1 { font-size: 28px; }
    }
    @media (max-width: 359px) {
      .calendar-heading { padding: 16px; }
      .calendar-icon { width: 34px; height: 34px; flex-basis: 34px; }
      h1 { font-size: 24px; }
    }
  </style>
</head>
<body>
  <header class="calendar-heading">
    <svg class="calendar-icon" viewBox="0 0 48 48" fill="none"
         stroke="currentColor" stroke-width="3.4" stroke-linecap="round"
         stroke-linejoin="round" aria-hidden="true" focusable="false">
      <rect x="7" y="10" width="34" height="31" rx="4"/>
      <path d="M16 6v8M32 6v8M8 20h32"/>
      <g fill="currentColor" stroke="none">
        <circle cx="16" cy="27" r="1.7"/><circle cx="24" cy="27" r="1.7"/><circle cx="32" cy="27" r="1.7"/>
        <circle cx="16" cy="34" r="1.7"/><circle cx="24" cy="34" r="1.7"/>
      </g>
    </svg>
    <h1>2026 Calendar</h1>
  </header>
</body>
</html>
