<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Daily water</title>
  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; background: #fff; color: #37352f; font-family: Georgia, 'Times New Roman', serif; -webkit-text-size-adjust: 100%; }
    main { max-width: 480px; padding: 22px; }
    header { display: flex; align-items: center; gap: 12px; }
    .drop { width: 42px; height: 42px; flex: 0 0 42px; color: #aa7942; }
    h1 { flex: 1; margin: 0; font: 700 30px/1.3 Georgia, 'Times New Roman', serif; letter-spacing: -0.7px; }
    button, input { font: 16px/1.3 Georgia, 'Times New Roman', serif; }
    button { min-height: 44px; cursor: pointer; border-radius: 6px; }
    button:focus-visible, input:focus-visible { outline: 2px solid #aa7942; outline-offset: 3px; }
    .quiet { padding: 8px; border: 0; background: transparent; color: #76532c; }
    .quiet:hover:enabled { background: #faf7f3; }
    .amount-line { margin: 12px 0 8px; font-size: 30px; font-weight: 700; letter-spacing: -0.7px; line-height: 1.3; }
    .unit { font-size: 16px; font-weight: 400; letter-spacing: 0; }
    .track { height: 7px; overflow: hidden; border-radius: 5px; background: #eee7de; }
    .fill { height: 100%; width: 0; border-radius: inherit; background: #aa7942; transition: width 180ms ease; }
    .remaining { margin: 7px 0 0; min-height: 18px; color: #786e64; font-size: 14px; line-height: 1.3; }
    .goal-panel { margin-top: 12px; padding: 12px; border: 1px solid #e8e0d6; border-radius: 6px; }
    .goal-panel label { display: block; margin-bottom: 6px; color: #6e655d; font-size: 14px; }
    .row { display: flex; align-items: center; gap: 8px; }
    input { width: 100%; min-width: 0; min-height: 44px; padding: 9px 11px; border: 1px solid #d8ccbc; border-radius: 6px; background: #fff; color: #37352f; }
    input::placeholder { color: #8b8176; opacity: 1; }
    .primary { flex: none; min-width: 66px; padding: 9px 16px; border: 1px solid #76532c; background: #76532c; color: #fff; }
    .primary:hover { background: #654625; }
    .quick { display: flex; gap: 8px; margin: 14px 0 9px; }
    .quick button { flex: 1; padding: 9px 4px; border: 1px solid #d8ccbc; background: #faf7f3; color: #76532c; white-space: nowrap; }
    .quick button:hover { background: #f0e8dd; }
    .undo { display: inline-flex; align-items: center; justify-content: center; flex: 0 0 44px; width: 44px; }
    .undo svg { width: 21px; height: 21px; }
    .undo:disabled { cursor: default; opacity: 0.35; }
    .footer { margin: 10px 0 0; color: #8b8884; font-size: 13px; line-height: 1.4; }
    .error, .storage-note { margin: 8px 0 0; color: #9c4438; font-size: 14px; line-height: 1.4; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    @media (max-width: 420px) { main { padding: 18px; } h1, .amount-line { font-size: 28px; } }
    @media (max-width: 359px) { main { padding: 16px; } h1, .amount-line { font-size: 24px; } .drop { width: 34px; height: 34px; flex-basis: 34px; } }
    @media (prefers-reduced-motion: reduce) { .fill { transition: none; } }
  </style>
</head>
<body>
  <main aria-label="Daily water tracker">
    <header>
      <svg class="drop" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <path d="M24 5C19 13 10 21 10 30a14 14 0 0 0 28 0C38 21 29 13 24 5Z"/>
        <path d="M17 29a7 7 0 0 0 7 8"/>
      </svg>
      <h1>Water</h1>
      <button id="goal-toggle" class="quiet" type="button" aria-expanded="true" aria-controls="goal-panel">Goal</button>
    </header>
    <p class="amount-line"><output id="total" aria-label="Water logged today">0</output><span id="target-wrap" hidden> / <span id="target"></span></span><span class="unit"> oz</span></p>
    <div id="progress" class="track" role="progressbar" aria-label="Daily water progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="fill" class="fill"></div></div>
    <p id="remaining" class="remaining">Set your daily goal.</p>
    <section id="goal-panel" class="goal-panel" aria-label="Edit daily goal">
      <form id="goal-form" novalidate>
        <label for="goal-input">Daily goal (oz)</label>
        <div class="row"><input id="goal-input" type="number" inputmode="decimal" min="0.1" max="999" step="0.1" placeholder="Your goal" autocomplete="off" required><button class="primary" type="submit">Save</button></div>
        <p id="goal-error" class="error" role="alert" hidden></p>
      </form>
    </section>
    <div class="quick" aria-label="Quick add water">
      <button type="button" data-oz="8">+8 oz</button>
      <button type="button" data-oz="16">+16 oz</button>
      <button type="button" data-oz="24">+24 oz</button>
    </div>
    <form id="drink-form" class="row" novalidate>
      <label class="sr-only" for="amount">Water to add in ounces</label>
      <input id="amount" type="number" inputmode="decimal" min="0.1" max="999" step="0.1" placeholder="Other oz" autocomplete="off" required>
      <button class="primary" type="submit">Add</button>
      <button id="undo" class="quiet undo" type="button" aria-label="Undo last drink" title="Undo last drink" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 4v5h5M4.5 8a8 8 0 1 1-0.1 8"/></svg>
      </button>
    </form>
    <p id="drink-error" class="error" role="alert" hidden></p>
    <p class="footer">Resets daily</p>
    <p id="storage-note" class="storage-note" role="status" hidden></p>
    <p id="status" class="sr-only" role="status" aria-live="polite"></p>
  </main>
  <script>
    (function () {
      'use strict';
      var key = 'pebbsz-water-v1:' + window.location.pathname;
      var total = document.getElementById('total');
      var targetWrap = document.getElementById('target-wrap');
      var target = document.getElementById('target');
      var progress = document.getElementById('progress');
      var fill = document.getElementById('fill');
      var remaining = document.getElementById('remaining');
      var goalToggle = document.getElementById('goal-toggle');
      var goalPanel = document.getElementById('goal-panel');
      var goalForm = document.getElementById('goal-form');
      var goalInput = document.getElementById('goal-input');
      var goalError = document.getElementById('goal-error');
      var drinkForm = document.getElementById('drink-form');
      var amount = document.getElementById('amount');
      var drinkError = document.getElementById('drink-error');
      var undo = document.getElementById('undo');
      var status = document.getElementById('status');
      var storageNote = document.getElementById('storage-note');
      var midnightTimer;

      function dayKey() {
        var now = new Date();
        return now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
      }
      function emptyState() { return { version: 1, day: dayKey(), goal: null, drinks: [] }; }
      var state = emptyState();
      function rounded(number) { return Math.round(number * 10) / 10; }
      function validAmount(number) { return typeof number === 'number' && Number.isFinite(number) && number >= 0.1 && number <= 999; }
      function validState(saved) {
        return saved && saved.version === 1 && typeof saved.day === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(saved.day) &&
          (saved.goal === null || validAmount(saved.goal)) && Array.isArray(saved.drinks) && saved.drinks.length <= 1000 && saved.drinks.every(validAmount);
      }
      function storageProblem() {
        storageNote.textContent = 'Saving is unavailable in this view. Your total will last only while this widget stays open.';
        storageNote.hidden = false;
      }
      function readLatest() {
        try {
          var raw = window.localStorage.getItem(key);
          if (raw !== null) {
            var saved = JSON.parse(raw);
            if (validState(saved)) { state = saved; }
          }
        } catch (error) { storageProblem(); }
        ensureDay();
      }
      function save() {
        try { window.localStorage.setItem(key, JSON.stringify(state)); }
        catch (error) { storageProblem(); }
      }
      function ensureDay() {
        var today = dayKey();
        if (state.day !== today) {
          state.day = today;
          state.drinks = [];
          save();
          status.textContent = 'A new day. Water total reset to zero.';
        }
      }
      function sum() { return rounded(state.drinks.reduce(function (a, b) { return a + b; }, 0)); }
      function render() {
        var logged = sum();
        var percent = state.goal === null ? 0 : Math.min(100, Math.round(logged / state.goal * 100));
        total.textContent = String(logged);
        targetWrap.hidden = state.goal === null;
        target.textContent = state.goal === null ? '' : String(state.goal);
        fill.style.width = percent + '%';
        progress.setAttribute('aria-valuenow', String(percent));
        progress.setAttribute('aria-valuetext', state.goal === null ? logged + ' ounces logged. Set a daily goal.' : logged + ' of ' + state.goal + ' ounces logged.');
        remaining.textContent = state.goal === null ? 'Set your daily goal.' : logged >= state.goal ? 'Goal reached' : rounded(state.goal - logged) + ' oz remaining';
        undo.disabled = state.drinks.length === 0;
      }
      function setGoalPanel(open) {
        goalPanel.hidden = !open;
        goalToggle.setAttribute('aria-expanded', String(open));
        if (open) { goalInput.value = state.goal === null ? '' : String(state.goal); }
      }
      function showError(element, message) { element.textContent = message; element.hidden = !message; }
      function addDrink(value) {
        readLatest();
        var ounces = rounded(value);
        if (!validAmount(ounces)) { showError(drinkError, 'Enter an amount from 0.1 to 999 oz.'); return; }
        if (state.drinks.length >= 1000 || sum() + ounces > 9999) { showError(drinkError, 'Daily total is too large. Check your entries.'); return; }
        state.drinks.push(ounces);
        save();
        render();
        showError(drinkError, '');
        status.textContent = ounces + ' ounces added. ' + sum() + ' ounces today.';
      }
      goalToggle.addEventListener('click', function () {
        readLatest();
        setGoalPanel(goalPanel.hidden);
        render();
        if (!goalPanel.hidden) { goalInput.focus(); }
      });
      goalForm.addEventListener('submit', function (event) {
        event.preventDefault();
        readLatest();
        var goal = rounded(Number(goalInput.value));
        if (!validAmount(goal)) { showError(goalError, 'Enter a goal from 0.1 to 999 oz.'); return; }
        state.goal = goal;
        save();
        render();
        showError(goalError, '');
        setGoalPanel(false);
        goalToggle.focus();
        status.textContent = 'Daily goal saved: ' + goal + ' ounces.';
      });
      document.querySelectorAll('[data-oz]').forEach(function (button) {
        button.addEventListener('click', function () { addDrink(Number(button.dataset.oz)); });
      });
      drinkForm.addEventListener('submit', function (event) {
        event.preventDefault();
        var value = Number(amount.value);
        addDrink(value);
        if (validAmount(rounded(value))) { amount.value = ''; }
      });
      undo.addEventListener('click', function () {
        readLatest();
        var removed = state.drinks.pop();
        if (removed !== undefined) { save(); status.textContent = removed + ' ounces removed.'; }
        render();
      });
      function refresh() {
        readLatest();
        render();
        window.clearTimeout(midnightTimer);
        var now = new Date();
        var midnight = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
        midnightTimer = window.setTimeout(refresh, Math.max(1000, midnight.getTime() - now.getTime() + 50));
      }
      window.addEventListener('storage', function (event) {
        if (event.key === key || event.key === null) {
          if (event.newValue === null) { state = emptyState(); }
          refresh();
          if (state.goal === null) { setGoalPanel(true); }
        }
      });
      window.addEventListener('pageshow', refresh);
      window.addEventListener('focus', refresh);
      document.addEventListener('visibilitychange', function () { if (!document.hidden) { refresh(); } });
      window.setInterval(refresh, 60000);
      refresh();
      setGoalPanel(state.goal === null);
    }());
  </script>
</body>
</html>
