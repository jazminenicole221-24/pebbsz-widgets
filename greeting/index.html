<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>A greeting for Pebbsz</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; width: 100%; background: #fff; }
    body { color: #37352f; -webkit-text-size-adjust: 100%; }
    .pebbsz-widget {
      width: 100%; min-height: 190px; padding: 22px;
      display: flex; flex-direction: column; justify-content: center;
      font-family: Georgia, 'Times New Roman', serif;
    }
    .pebbsz-heading { display: flex; align-items: center; gap: 12px; }
    .pebbsz-icon { width: 42px; height: 42px; flex: 0 0 42px; color: #aa7942; }
    .pebbsz-icon svg { display: block; width: 100%; height: 100%; }
    .pebbsz-heading h1 {
      margin: 0; font-family: Georgia, 'Times New Roman', serif;
      font-size: 30px;
      font-weight: 700; letter-spacing: -0.7px; line-height: 1.3;
      flex: 1; min-width: 0; white-space: nowrap;
    }
    .pebbsz-heading .name { display: inline; font-style: italic; }
    .pebbsz-date {
      display: block; margin-top: 8px; color: #8b8884;
      font-size: 16px; font-weight: 600; line-height: 1.5;
      overflow-wrap: anywhere;
    }
    .pebbsz-icon [hidden] { display: none !important; }
    @media (max-width: 420px) {
      .pebbsz-widget { padding: 18px; }
      .pebbsz-heading h1 { font-size: 28px; }
    }
    @media (max-width: 359px) {
      .pebbsz-widget { padding: 16px; min-height: 170px; }
      .pebbsz-heading h1 { font-size: 24px; }
      .pebbsz-icon { width: 34px; height: 34px; flex-basis: 34px; }
      .pebbsz-date { font-size: 14px; }
    }
  </style>
</head>
<body>
  <main class="pebbsz-widget" aria-label="Your daily greeting">
    <div class="pebbsz-heading">
      <div class="pebbsz-icon" aria-hidden="true">
        <svg id="pebbsz-sun" viewBox="0 0 48 48" fill="none">
          <circle cx="24" cy="24" r="8" fill="currentColor"/>
          <g stroke="currentColor" stroke-width="3.4" stroke-linecap="round">
            <path d="M24 4v6M24 38v6M4 24h6M38 24h6"/>
            <path d="m10 10 4.2 4.2m19.6 19.6L38 38M10 38l4.2-4.2m19.6-19.6L38 10"/>
          </g>
        </svg>
        <svg id="pebbsz-moon" viewBox="0 0 48 48" fill="none" hidden>
          <path d="M33 5a19 19 0 1 0 10 30A20 20 0 0 1 33 5Z" fill="currentColor"/>
        </svg>
      </div>
      <h1 id="pebbsz-title"><span id="pebbsz-greeting">Hello,</span> <span class="name">Pebbsz</span></h1>
    </div>
    <time id="pebbsz-datetime" class="pebbsz-date">A new moment to begin again.</time>
  </main>
  <script>
    (function () {
      'use strict';
      var greeting = document.getElementById('pebbsz-greeting');
      var datetime = document.getElementById('pebbsz-datetime');
      var sun = document.getElementById('pebbsz-sun');
      var moon = document.getElementById('pebbsz-moon');
      var weekdays = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
      var months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

      function update() {
        var now = new Date();
        var hour = now.getHours();
        var night = hour < 5 || hour >= 21;
        var words = night ? 'Good night,' : hour < 12 ? 'Good morning,' : hour < 17 ? 'Good afternoon,' : 'Good evening,';
        var minutes = ('0' + now.getMinutes()).slice(-2);
        var time = (hour % 12 || 12) + ':' + minutes + (hour >= 12 ? ' PM' : ' AM');
        var line = weekdays[now.getDay()] + ', ' + months[now.getMonth()] + ' ' + now.getDate() + ' \u00b7 ' + time;

        if (greeting.textContent !== words) {
          greeting.textContent = words;
        }
        if (datetime.textContent !== line) {
          datetime.textContent = line;
          datetime.setAttribute('datetime', now.toISOString());
        }
        sun.hidden = night;
        moon.hidden = !night;
      }

      update();
      window.setInterval(update, 1000);
      window.addEventListener('pageshow', update);
      window.addEventListener('focus', update);
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) { update(); }
      });
    }());
  </script>
</body>
</html>
